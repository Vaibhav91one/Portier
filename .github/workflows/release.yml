name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
            archive_ext: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
            archive_ext: zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          ARCHIVE_NAME=portier-${{ matrix.target }}
          cd target/${{ matrix.target }}/release
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            7z a ../../../$ARCHIVE_NAME.zip portier${{ matrix.ext }}
          else
            tar czf ../../../$ARCHIVE_NAME.tar.gz portier${{ matrix.ext }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: portier-${{ matrix.target }}.${{ matrix.archive_ext }}
          path: portier-${{ matrix.target }}.${{ matrix.archive_ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: ./artifacts/**/*
